name: Hello Workflow v2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: my-first-app

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Greet
        run: echo "Hello from $APP_NAME"

      - name: Who triggered this?
        run: |
          echo "Triggered by: ${{ github.actor }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"

  say-goodbye:
    runs-on: ubuntu-latest
    needs: say-hello
    steps:
      - name: Goodbye
        run: echo "All done!"
